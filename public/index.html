<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Clone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Courier New', monospace;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.7);
    }
    #crosshair::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
    }
    #hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 13px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-left: 3px solid #00aa00;
    }
    #debug {
      line-height: 1.6;
    }
    #debug div {
      margin: 2px 0;
    }
    #hotbar {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      pointer-events: auto;
    }
    .hotbar-slot {
      width: 40px;
      height: 40px;
      border: 2px solid #888;
      background: rgba(100, 100, 100, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.1s;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }
    .hotbar-slot.active {
      border-color: #ffff00;
      background: rgba(200, 200, 0, 0.9);
      transform: scale(1.15);
      box-shadow: 0 0 15px rgba(255, 255, 0, 0.7);
      color: #000;
    }
    #blockName {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
      min-width: 150px;
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 5px 10px;
      border-radius: 3px;
      pointer-events: none;
    }
    #controls {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 11px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
      opacity: 0.85;
      max-width: 220px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 12px;
      border-left: 3px solid #0099ff;
      border-radius: 3px;
    }
    #controls strong {
      display: block;
      margin-bottom: 6px;
      color: #0099ff;
      font-size: 12px;
    }
    #controls div {
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="crosshair"></div>
    <div id="hud">
      <div id="debug"></div>
    </div>
    <div id="hotbar"></div>
    <div id="blockName"></div>
    <div id="controls">
      <strong>CONTROLS</strong>
      WASD: Move<br>
      Mouse: Look<br>
      Space: Jump<br>
      Shift: Sprint<br>
      Left Click: Break<br>
      Right Click: Place<br>
      1-9: Select<br>
      Scroll: Hotbar
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
