<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Clone</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      font-family: 'Arial', sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.7);
    }
    #crosshair::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
    }
    #hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 16px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }
    #hotbar {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      pointer-events: auto;
    }
    .hotbar-slot {
      width: 40px;
      height: 40px;
      border: 2px solid #888;
      background: rgba(100, 100, 100, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .hotbar-slot.active {
      border-color: #fff;
      background: rgba(150, 150, 150, 0.9);
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
    #blockName {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      min-width: 150px;
      text-align: center;
    }
    #controls {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 12px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      opacity: 0.7;
      max-width: 200px;
    }
    #debug {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 12px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="crosshair"></div>
    <div id="hud">
      <div id="debug"></div>
    </div>
    <div id="hotbar"></div>
    <div id="blockName"></div>
    <div id="controls">
      <strong>Controls</strong><br>
      WASD: Move<br>
      Mouse: Look<br>
      Space: Jump<br>
      Shift: Sprint/Crouch<br>
      LClick: Break<br>
      RClick: Place<br>
      1-9: Select Block
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
