<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone - Haiku 4.5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div id="crosshair"></div>
        <div id="hud">
            <div id="coords">X: 0 Y: 0 Z: 0</div>
            <div id="fps">FPS: 0</div>
            <div id="blockInfo">Stone</div>
        </div>
        <div id="inventory">
            <div class="inventory-slot selected" data-index="0" data-block="1" style="--block-color: #808080;">
                <span class="slot-number">1</span>
                <div class="slot-block"></div>
            </div>
            <div class="inventory-slot" data-index="1" data-block="2" style="--block-color: #228B22;">
                <span class="slot-number">2</span>
                <div class="slot-block"></div>
            </div>
            <div class="inventory-slot" data-index="2" data-block="3" style="--block-color: #8B7355;">
                <span class="slot-number">3</span>
                <div class="slot-block"></div>
            </div>
            <div class="inventory-slot" data-index="3" data-block="7" style="--block-color: #EDD5B1;">
                <span class="slot-number">4</span>
                <div class="slot-block"></div>
            </div>
            <div class="inventory-slot" data-index="4" data-block="11" style="--block-color: #1A1A1A;">
                <span class="slot-number">5</span>
                <div class="slot-block"></div>
            </div>
            <div class="inventory-slot" data-index="5" data-block="12" style="--block-color: #B8860B;">
                <span class="slot-number">6</span>
                <div class="slot-block"></div>
            </div>
            <div class="inventory-slot" data-index="6" data-block="13" style="--block-color: #FFD700;">
                <span class="slot-number">7</span>
                <div class="slot-block"></div>
            </div>
            <div class="inventory-slot" data-index="7" data-block="14" style="--block-color: #00CED1;">
                <span class="slot-number">8</span>
                <div class="slot-block"></div>
            </div>
            <div class="inventory-slot" data-index="8" data-block="15" style="--block-color: #0F0F0F;">
                <span class="slot-number">9</span>
                <div class="slot-block"></div>
            </div>
        </div>
        <div id="help">
            <p><strong>Controls:</strong> WASD Move | Space Jump | Shift Sprint/Crouch | Mouse Look</p>
            <p>Left-Click Destroy | Right-Click Place | 1-9/Scroll Select Block</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>
