<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft - Haiku 4.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 0 3px rgba(0,0,0,0.8);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.7);
            cursor: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.7);
        }

        #crosshair::before {
            width: 2px;
            height: 6px;
            left: 9px;
            top: -8px;
        }

        #crosshair::after {
            width: 2px;
            height: 6px;
            left: 9px;
            bottom: -8px;
        }

        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.7);
            padding: 4px;
            border: 2px solid #888;
            border-radius: 2px;
        }

        .hotbar-slot {
            width: 44px;
            height: 44px;
            border: 2px solid #888;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            position: relative;
        }

        .hotbar-slot.active {
            border-color: #fff;
            background: #2a2a2a;
        }

        .hotbar-slot span {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #ccc;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border: 1px solid #666;
            border-radius: 4px;
            font-size: 12px;
            min-width: 200px;
        }

        #blockName {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 16px;
            display: none;
            pointer-events: none;
        }

        #blockedTarget {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% + 30px));
            background: rgba(0,0,0,0.8);
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 11px;
            display: none;
            pointer-events: none;
            color: #aaa;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="crosshair"></div>
        <div id="info">
            <div>FPS: <span id="fps">0</span></div>
            <div>Pos: <span id="pos">0, 0, 0</span></div>
            <div>Chunks: <span id="chunks">0</span></div>
            <div>Blocks: <span id="blocks">0</span></div>
            <div id="blockInfo" style="display: none;">
                Selected: <span id="selectedBlock">Grass</span>
            </div>
        </div>
        <div id="hotbar"></div>
        <div id="blockName"></div>
        <div id="blockedTarget"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
