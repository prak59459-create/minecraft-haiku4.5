<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.5);
            pointer-events: none;
            z-index: 99;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.5);
        }
        #crosshair::before {
            width: 2px;
            height: 6px;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
        }
        #crosshair::after {
            width: 6px;
            height: 2px;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
        }
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 99;
        }
        .hotbar-slot {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(100,100,100,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.1s;
        }
        .hotbar-slot.active {
            border-color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
        }
        #blockPreview {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            padding: 10px;
            color: white;
            font-size: 12px;
            z-index: 99;
        }
        #blockPreview canvas {
            width: 100%;
            height: 80px;
            border-radius: 3px;
        }
        #help {
            position: fixed;
            bottom: 120px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 180px;
            line-height: 1.4;
            z-index: 98;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #help:hover {
            background: rgba(0,0,0,0.9);
            border-color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="stats">FPS: 0 | X: 0 Y: 0 Z: 0</div>
        <div id="blockInfo">Block: Air</div>
    </div>
    <div id="crosshair"></div>
    <div id="hotbar"></div>
    <div id="blockPreview">
        <div>Block:</div>
        <canvas id="previewCanvas"></canvas>
    </div>
    <div id="help" onclick="this.style.display='none'">
        <strong>WASD</strong> Move<br>
        <strong>Mouse</strong> Look<br>
        <strong>Space</strong> Jump<br>
        <strong>Shift</strong> Sprint<br>
        <strong>L-Click</strong> Break<br>
        <strong>R-Click</strong> Place<br>
        <strong>1-9</strong> Block Select
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@3.0.0/dist/simplex-noise.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
