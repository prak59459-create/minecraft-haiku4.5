<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #hud {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-size: 16px;
            color: #fff;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
        }
        #inventory {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.7);
            padding: 8px;
            border-radius: 4px;
        }
        .inventory-slot {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(200,200,200,0.3);
            background: rgba(100,100,100,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .inventory-slot.selected {
            border-color: #fff;
            background: rgba(150,150,150,0.8);
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }
        #stats {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
        }
        #blockDisplay {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        #info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div id="crosshair"></div>
        <div id="stats">
            <div>FPS: <span id="fps">0</span></div>
            <div>Pos: <span id="pos">0, 0, 0</span></div>
            <div>Chunks: <span id="chunks">0</span></div>
        </div>
        <div id="blockDisplay">Block: <span id="blockName">Grass</span></div>
        <div id="inventory"></div>
        <div id="info">
            <div>W/A/S/D - Move</div>
            <div>Mouse - Look</div>
            <div>SPACE - Jump</div>
            <div>SHIFT - Sprint/Crouch</div>
            <div>Click - Destroy/Place</div>
            <div>1-9 - Block Select</div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
