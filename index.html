<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone - Haiku 4.5</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container"></div>

    <div id="ui">
        <div id="crosshair"></div>
        <div id="hotbar">
            <div id="hotbar-items"></div>
            <div id="block-info"></div>
        </div>
        <div id="debug-info">
            <div id="fps"></div>
            <div id="position"></div>
            <div id="chunk-info"></div>
        </div>
        <div id="day-night-cycle">
            <div id="time-display"></div>
            <div id="sun-indicator"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.js"></script>
    <script src="js/config.js"></script>
    <script src="js/performance.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/terrain.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/player.js"></script>
    <script src="js/world.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
