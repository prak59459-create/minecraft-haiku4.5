<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Haiku 4.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
        }

        .hotbar {
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border: 2px solid #888;
            border-radius: 4px;
        }

        .hotbar-slot {
            width: 45px;
            height: 45px;
            background: rgba(100, 100, 100, 0.5);
            border: 1px solid #666;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
            cursor: pointer;
        }

        .hotbar-slot.active {
            background: rgba(150, 150, 150, 0.8);
            border: 2px solid #fff;
        }

        .hotbar-slot-number {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #ccc;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .crosshair-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
        }

        .crosshair-h {
            width: 6px;
            height: 1px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
        }

        .crosshair-v {
            width: 1px;
            height: 6px;
            top: 50%;
            left: 50%;
            transform: translateY(-50%);
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            z-index: 10;
        }

        #info div {
            margin: 2px 0;
        }

        #block-name {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div id="crosshair">
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
        </div>
        <div id="block-name"></div>
        <div id="info">
            <div>W/A/S/D: Move</div>
            <div>Mouse: Look</div>
            <div>Space: Jump</div>
            <div>Shift: Sprint/Crouch</div>
            <div>1-9: Select Block</div>
            <div>Left Click: Destroy</div>
            <div>Right Click: Place</div>
            <hr style="margin: 5px 0; border: none; border-top: 1px solid #666;">
            <div id="pos">Position: 0, 0, 0</div>
            <div id="chunk">Chunk: 0, 0</div>
            <div id="fps">FPS: 0</div>
        </div>
        <div id="hud">
            <div class="hotbar" id="hotbar"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

    <script src="src/config.js"></script>
    <script src="src/utils.js"></script>
    <script src="src/block-types.js"></script>
    <script src="src/physics.js"></script>
    <script src="src/world.js"></script>
    <script src="src/player.js"></script>
    <script src="src/renderer.js"></script>
    <script src="src/input.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
