<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Haiku 4.5</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
    }
    #crosshair::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 8px;
      background: rgba(255, 255, 255, 0.5);
      left: 50%;
      top: -12px;
      transform: translateX(-50%);
    }
    #crosshair::before {
      content: '';
      position: absolute;
      width: 8px;
      height: 2px;
      background: rgba(255, 255, 255, 0.5);
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
    }
    #hotbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 4px;
    }
    .hotbar-slot {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(100, 100, 100, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      border-radius: 2px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: bold;
    }
    .hotbar-slot.active {
      border-color: rgba(255, 255, 255, 0.8);
      background: rgba(150, 150, 150, 0.7);
      color: rgba(255, 255, 255, 1);
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      line-height: 1.6;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="loading">Generating World...</div>
  <div id="ui">
    <div id="crosshair"></div>
    <div id="hotbar"></div>
    <div id="info"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
