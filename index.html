<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Haiku 4.5</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }
    canvas { display: block; }
    #hud {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-size: 16px;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 50%;
    }
    #blockSelector {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.6);
      padding: 12px;
      border-radius: 8px;
    }
    #selectedBlockName {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      min-width: 80px;
      text-align: center;
    }
    #blockSlots {
      display: flex;
      gap: 5px;
    }
    .blockSlot {
      width: 40px;
      height: 40px;
      background: rgba(100,100,100,0.5);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .blockSlot.active {
      border-color: rgba(255,255,255,0.9);
      background: rgba(100,100,100,0.8);
      transform: scale(1.1);
    }
    #stats {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      line-height: 1.5;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      padding: 20px 40px;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="blockSelector">
      <div id="selectedBlockName">Dirt</div>
      <div id="blockSlots"></div>
    </div>
    <div id="stats"></div>
    <div id="message"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
