<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone - Haiku 4.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .block-slot {
            width: 40px;
            height: 40px;
            border: 2px solid #888;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.1s;
        }

        .block-slot.active {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
        }

        #crosshair::before {
            width: 2px;
            height: 4px;
            left: 50%;
            top: -6px;
            transform: translateX(-50%);
        }

        #crosshair::after {
            width: 4px;
            height: 2px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 4px;
            line-height: 1.6;
        }

        #controls {
            position: absolute;
            bottom: 100px;
            left: 10px;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 4px;
            line-height: 1.5;
            max-width: 200px;
        }

        .time-of-day {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="crosshair"></div>
        <div id="info">
            <div>Pos: <span id="posX">0</span> <span id="posY">0</span> <span id="posZ">0</span></div>
            <div>FPS: <span id="fps">60</span></div>
            <div>Chunks: <span id="chunks">0</span></div>
        </div>
        <div class="time-of-day">
            <div>Time: <span id="time">6:00</span></div>
        </div>
        <div id="stamina-bar" style="position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); width: 200px; height: 10px; background: rgba(0,0,0,0.5); border: 1px solid #888; border-radius: 2px;">
            <div id="stamina-fill" style="height: 100%; background: #4CAF50; width: 100%; border-radius: 1px; transition: width 0.1s;"></div>
        </div>
        <div id="controls">
            <div><b>Controls:</b></div>
            <div>W/A/S/D - Move</div>
            <div>Space - Jump</div>
            <div>Shift - Sprint/Crouch</div>
            <div>Mouse - Look</div>
            <div>Click - Destroy</div>
            <div>Right Click - Place</div>
            <div>1-9/Scroll - Block</div>
        </div>
        <div id="hud"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/dist/simplex-noise.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/util.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/water.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/movement.js"></script>
    <script src="js/world.js"></script>
    <script src="js/player.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
