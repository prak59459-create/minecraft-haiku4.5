<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone - Haiku 4.5</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-container">
        <div id="crosshair"></div>
        <div id="hotbar">
            <div id="block-selector"></div>
        </div>
        <div id="hud">
            <div id="coordinates"></div>
            <div id="fps"></div>
            <div id="time-of-day"></div>
        </div>
        <div id="game-state"></div>
        <div id="inventory"></div>
        <div id="help-text">
            <strong>Controls:</strong><br>
            WASD: Move<br>
            Mouse: Look<br>
            Space: Jump<br>
            Shift: Sprint<br>
            Ctrl: Crouch<br>
            F: Fly Mode<br>
            1-9: Block Select<br>
            Scroll: Cycle Blocks<br>
            Left Click: Break<br>
            Right Click: Place<br>
            E: Inventory<br>
            H: Hide Help
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
