<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone - Haiku 4.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-family: monospace;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .hud-top-left {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            line-height: 1.6;
        }

        .hud-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 4px;
        }

        .hud-center::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.5);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .block-info {
            position: absolute;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border: 1px solid rgba(100,100,100,0.8);
            border-radius: 4px;
            min-width: 100px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .block-info.active {
            opacity: 1;
        }

        .hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            background: rgba(0,0,0,0.6);
            padding: 5px;
            border: 2px solid rgba(100,100,100,0.8);
            border-radius: 4px;
        }

        .hotbar-slot {
            width: 40px;
            height: 40px;
            background: rgba(50,50,50,0.8);
            border: 1px solid rgba(100,100,100,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.1s;
        }

        .hotbar-slot.active {
            background: rgba(100,150,200,0.8);
            border-color: rgba(150,200,255,0.8);
            color: #fff;
            transform: scale(1.1);
        }

        .hotbar-slot img {
            width: 30px;
            height: 30px;
            image-rendering: pixelated;
        }

        .debug-info {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            line-height: 1.4;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border: 1px solid rgba(100,100,100,0.8);
            border-radius: 4px;
        }

        .help-text {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border: 1px solid rgba(100,100,100,0.8);
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .help-text.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-top-left">
            <div id="fps">FPS: 60</div>
            <div id="position">X: 0 Y: 0 Z: 0</div>
            <div id="chunks">Chunks: 0</div>
            <div id="blocks">Blocks: 0</div>
        </div>

        <div class="hud-center"></div>

        <div class="debug-info">
            <div id="debug">Seed: random</div>
        </div>

        <div class="hotbar" id="hotbar"></div>

        <div class="block-info" id="blockInfo"></div>

        <div class="help-text" id="helpText">
            WASD: Move | Mouse: Look | Space: Jump | Shift: Sprint/Crouch | Click: Destroy/Place | 1-9: Select Block
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
