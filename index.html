<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="ui-container">
        <div id="crosshair"></div>
        <div id="block-selector"></div>
        <div id="inventory"></div>
        <div id="stats">
            <div id="fps">FPS: 0</div>
            <div id="position">X: 0 Y: 0 Z: 0</div>
            <div id="chunks">Chunks: 0</div>
        </div>
        <div id="time-indicator">Time: Day</div>
        <div id="help-panel">
            <h4>Controls</h4>
            <p>W/A/S/D - Move</p>
            <p>Mouse - Look</p>
            <p>Space - Jump</p>
            <p>Shift - Sprint</p>
            <p>Left Click - Break</p>
            <p>Right Click - Place</p>
            <p>1-9 - Select Block</p>
            <p>Scroll - Cycle Blocks</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="blocks.js"></script>
    <script src="terrain.js"></script>
    <script src="audio.js"></script>
    <script src="particles.js"></script>
    <script src="player.js"></script>
    <script src="rendering.js"></script>
    <script src="game.js"></script>
    <script src="main.js"></script>
</body>
</html>
