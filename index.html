<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Haiku</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }

        #crosshair {
            position: fixed; left: 50%; top: 50%; width: 18px; height: 18px;
            transform: translate(-50%, -50%); pointer-events: none; mix-blend-mode: difference;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
        #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
        #crosshair::after { top: 8px; left: 0; width: 18px; height: 2px; }

        #debug {
            position: fixed; top: 8px; left: 8px; margin: 0; padding: 6px 8px;
            color: #fff; background: rgba(0, 0, 0, 0.45); font-size: 12px; white-space: pre; pointer-events: none;
        }

        #hotbar {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; padding: 4px; background: rgba(0, 0, 0, 0.5); pointer-events: none;
        }
        .slot {
            position: relative; width: 40px; height: 40px; border: 2px solid #555;
            display: flex; align-items: center; justify-content: center;
        }
        .slot.active { border-color: #fff; }
        .swatch { width: 24px; height: 24px; box-shadow: inset 0 -6px rgba(0, 0, 0, 0.25); }
        .slot span { position: absolute; right: 2px; bottom: 0; color: #fff; font-size: 10px; text-shadow: 1px 1px #000; }

        #block-name {
            position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
            color: #fff; text-shadow: 1px 1px #000; font-size: 14px; transition: opacity 0.4s; pointer-events: none;
        }

        #overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; color: #fff; background: rgba(0, 0, 0, 0.55); text-align: center; line-height: 1.6;
        }
        #overlay h1 { margin: 0; font-size: 28px; }
        #overlay p { margin: 0; font-size: 13px; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>
    <div id="crosshair"></div>
    <pre id="debug"></pre>
    <div id="block-name"></div>
    <div id="hotbar"></div>
    <div id="overlay">
        <h1>クリックして開始</h1>
        <p>
            WASD 移動 / マウス 視点 / Space ジャンプ・泳ぐ<br>
            Shift ダッシュ / C しゃがむ<br>
            左クリック 破壊 / 右クリック 設置<br>
            1-9・ホイール ブロック選択 / Esc 一時停止
        </p>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
