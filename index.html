<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone - Haiku 4.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ffffff;
            --secondary-color: #6496ff;
            --bg-color: rgba(0, 0, 0, 0.7);
            --border-color: rgba(255, 255, 255, 0.3);
            --text-color: rgba(255, 255, 255, 0.9);
            --accent-color: #ff6b6b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: var(--text-color);
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary-color);
            opacity: 0.6;
            pointer-events: auto;
        }

        .crosshair-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 2px;
            background: var(--primary-color);
            transform: translate(-50%, -50%);
            opacity: 0.6;
        }

        #blockSelector {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: var(--bg-color);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .blockSlot {
            width: 45px;
            height: 45px;
            border: 2px solid var(--border-color);
            background: rgba(50, 50, 50, 0.8);
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-color);
            transition: all 0.15s ease;
            font-weight: bold;
            white-space: normal;
            text-align: center;
            pointer-events: auto;
        }

        .blockSlot:hover {
            border-color: var(--primary-color);
            transform: scale(1.05);
        }

        .blockSlot.selected {
            border-color: var(--primary-color);
            background: var(--secondary-color);
            color: #fff;
            box-shadow: 0 0 10px var(--secondary-color);
        }

        #stats {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--bg-color);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            line-height: 1.8;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        #stats div {
            margin: 2px 0;
        }

        #info {
            position: absolute;
            bottom: 70px;
            left: 10px;
            background: var(--bg-color);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 11px;
            line-height: 1.6;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        #dayNightCycle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--bg-color);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.8;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        #dayNightCycle div {
            margin: 2px 0;
        }

        /* Loading screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #fff;
            font-family: monospace;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .blockSlot {
                width: 35px;
                height: 35px;
                font-size: 9px;
            }

            #stats, #dayNightCycle {
                font-size: 10px;
                padding: 8px 12px;
            }

            #info {
                font-size: 10px;
                bottom: 65px;
            }
        }
    </style>
</head>
<body>
    <div id="hud">
        <div id="crosshair">
            <div class="crosshair-dot"></div>
        </div>
        <div id="stats">
            <div>FPS: <span id="fps">0</span></div>
            <div>Pos: <span id="pos">0, 0, 0</span></div>
            <div>Chunks: <span id="chunks">0</span></div>
        </div>
        <div id="info">
            <div>WASD: Move | Mouse: Look</div>
            <div>Space: Jump | Shift: Sprint/Crouch</div>
            <div>LMB: Destroy | RMB: Place</div>
            <div>1-9/Scroll: Block Select</div>
        </div>
        <div id="dayNightCycle">
            <div>Time: <span id="time">00:00</span></div>
            <div>Light: <span id="lightLevel">100%</span></div>
        </div>
        <div id="blockSelector"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
