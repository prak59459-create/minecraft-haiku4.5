<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone - Haiku 4.5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div id="crosshair"></div>
        <div id="hud">
            <div id="coords">X: 0 Y: 0 Z: 0</div>
            <div id="fps">FPS: 0</div>
            <div id="blockInfo">Stone</div>
        </div>
        <div id="inventory">
            <div class="inventory-slot selected" data-index="0" data-block="1">
                <span class="slot-number">1</span>
                <div class="slot-block" style="background-color: #808080;" title="Stone"></div>
            </div>
            <div class="inventory-slot" data-index="1" data-block="2">
                <span class="slot-number">2</span>
                <div class="slot-block" style="background-color: #228B22;" title="Grass"></div>
            </div>
            <div class="inventory-slot" data-index="2" data-block="3">
                <span class="slot-number">3</span>
                <div class="slot-block" style="background-color: #8B7355;" title="Dirt"></div>
            </div>
            <div class="inventory-slot" data-index="3" data-block="5">
                <span class="slot-number">4</span>
                <div class="slot-block" style="background-color: #654321;" title="Oak Log"></div>
            </div>
            <div class="inventory-slot" data-index="4" data-block="7">
                <span class="slot-number">5</span>
                <div class="slot-block" style="background-color: #EDD5B1;" title="Sand"></div>
            </div>
            <div class="inventory-slot" data-index="5" data-block="9">
                <span class="slot-number">6</span>
                <div class="slot-block" style="background-color: #999999;" title="Gravel"></div>
            </div>
            <div class="inventory-slot" data-index="6" data-block="4">
                <span class="slot-number">7</span>
                <div class="slot-block" style="background-color: #696969;" title="Cobblestone"></div>
            </div>
            <div class="inventory-slot" data-index="7" data-block="15">
                <span class="slot-number">8</span>
                <div class="slot-block" style="background-color: #A39E93;" title="Clay"></div>
            </div>
            <div class="inventory-slot" data-index="8" data-block="11">
                <span class="slot-number">9</span>
                <div class="slot-block" style="background-color: #1A1A1A;" title="Coal Ore"></div>
            </div>
        </div>
        <div id="help">
            <p><strong>Movement:</strong> WASD | Space Jump | Shift Crouch</p>
            <p><strong>Interaction:</strong> Left-Click Destroy | Right-Click Place</p>
            <p><strong>Selection:</strong> 1-9 or Scroll | C Pick Block</p>
            <p><strong>Info:</strong> F3 Debug | H Help</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>
