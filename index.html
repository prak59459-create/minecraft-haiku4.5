<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Haiku 4.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-color: white;
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
        }
        .hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }
        .hotbar-slot {
            width: 40px;
            height: 40px;
            border: 2px solid #888;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .hotbar-slot.selected {
            border-color: white;
            background: rgba(255, 255, 255, 0.3);
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            max-width: 250px;
        }
        .block-name {
            font-weight: bold;
        }
        #controls {
            position: absolute;
            bottom: 100px;
            left: 10px;
            color: white;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 5px;
            font-family: monospace;
            max-width: 250px;
        }
        .control-item {
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="crosshair"></div>
        <div class="hotbar" id="hotbar"></div>
        <div id="info">
            <div>FPS: <span id="fps">60</span></div>
            <div>Position: <span id="pos">0, 0, 0</span></div>
            <div>Block: <span class="block-name" id="block">None</span></div>
            <div>Time: <span id="time">Day</span></div>
            <div>Chunks: <span id="chunks">0</span></div>
        </div>
        <div id="controls">
            <div class="control-item"><strong>Controls:</strong></div>
            <div class="control-item">WASD - Move</div>
            <div class="control-item">Mouse - Look</div>
            <div class="control-item">Space - Jump</div>
            <div class="control-item">Shift - Sprint</div>
            <div class="control-item">Ctrl - Crouch</div>
            <div class="control-item">L-Click - Destroy</div>
            <div class="control-item">R-Click - Place</div>
            <div class="control-item">1-9 - Select</div>
        </div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@r128/build/three.module.js",
            "perlin": "https://cdn.jsdelivr.net/npm/perlin-noise@0.0.5/perlin.js"
        }
    }
    </script>
    <script type="module" src="src/index.js"></script>
</body>
</html>
